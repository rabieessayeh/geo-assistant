# API + map on http://localhost:8000
#
#   cp .env.example .env    # then set LLM_BASE_URL / LLM_API_KEY / LLM_MODEL
#   docker compose up --build
#
# With an Ollama server running on the host, use
#   LLM_BASE_URL=http://host.docker.internal:11434/v1

services:
  geo-assistant:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      # Overrides .env: paths inside the container. Use data/lux after running
      # scripts/fetch_lux_data.py on the host.
      DATA_DIR: ${DATA_DIR:-data/sample}
    volumes:
      - ./data:/app/data:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
